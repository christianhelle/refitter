name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*'
      - '!.github/workflows/build.yml'
      - '!src/**/*.csproj'
      - '!src/**/*.cs'
    branches:
      - 'main'
  pull_request:
    paths-ignore:
      - '**/*'
      - '!.github/workflows/build.yml'
      - '!src/**/*.csproj'
      - '!src/**/*.cs'
    branches:
      - '*'

env:
  VERSION: 2.2.0.${{ github.run_number }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 👌 Verify build
    runs-on: ubuntu-latest
    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: 🛠️ Prepare
      continue-on-error: true
      run: |
        rm -rf src/Refitter.SourceGenerator.Tests/AdditionalFiles/Generated
        dotnet restore src/Refitter.SourceGenerator.Tests/Refitter.SourceGenerator.Tests.csproj
        dotnet msbuild src/Refitter.SourceGenerator.Tests/Refitter.SourceGenerator.Tests.csproj
    - name: 🛠️ Build
      run: dotnet build -c Release src/Refitter.slnx -p:UseSourceLink=true -p:PackageVersion="${{ env.VERSION }}" -p:Version="${{ env.VERSION }}"
    - name: 📦 Pack MSBuild task
      run: |
        dotnet pack --no-build -c Release src/Refitter.MSBuild/Refitter.MSBuild.csproj `
          -p:UseSourceLink=true `
          -p:PackageVersion="${{ env.VERSION }}" `
          -p:Version="${{ env.VERSION }}"
      shell: pwsh
    - name: 🧪 Unit tests (fast gate)
      run: dotnet test --solution src/Refitter.slnx -c Release --no-build --treenode-filter "/*/*/*/*[Category!=Integration]"
    - name: 🧪 Full test suite
      if: ${{ success() }}
      run: dotnet test --solution src/Refitter.slnx -c Release --no-build
    - name: 🗳️ Upload
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: |
          **/*.nupkg
          README.md
    - name: 🛠️ Build Docs
      run: |
        dotnet tool update -g docfx
        docfx docs/docfx_project/docfx.json
    - name: 🚀 Publish to GitHub Packages
      if: github.event_name == 'push'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet nuget push **/*.nupkg `
          --source https://nuget.pkg.github.com/christianhelle/index.json `
          --api-key $env:GITHUB_TOKEN `
          --skip-duplicate
