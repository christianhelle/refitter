name: Contributors

on:
  workflow_dispatch:
  push:
    paths:
      - '.all-contributorsrc'
      - '.github/workflows/contributors.yml'
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  contributors:
    if: github.repository == 'christianhelle/refitter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PAT }}
      - name: Re-generate contributors lists
        run: |
          npm install --global --ignore-scripts all-contributors-cli@6.26.1
          all-contributors generate
      - name: Git commit contributors lists
        run: |
          if git diff --quiet -- README.md docs/docfx_project/index.md; then
            echo "Contributors lists are up to date"
            exit 0
          fi
          git config --global user.name "Continuous Integration"
          git config --global user.email "username@users.noreply.github.com"
          git add README.md docs/docfx_project/index.md
          git commit -m "Update contributors"
          git push origin HEAD:main
