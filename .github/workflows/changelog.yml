name: Changelog

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*'
      - '!.github/workflows/changelog.yml'
      - '!src/**/*.csproj'
      - '!src/**/*.cs'
    branches:
      - 'main'
    tags:
      - '**'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  changelog:
    if: github.repository == 'christianhelle/refitter' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Re-generate CHANGELOG.md
        id: changelog
        uses: christianhelle/changelog-generator-action@main
        with:
          output: CHANGELOG.md
          github-token: ${{ secrets.PAT }}
      - name: Git commit CHANGELOG.md
        if: steps.changelog.outputs.changed == 'true'
        run: |
          git config --global user.name "Continuous Integration"
          git config --global user.email "username@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update changelog [skip ci]"
          git push origin HEAD:main
