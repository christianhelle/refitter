name: MSBuild Tasks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/msbuild.yml'
      - 'src/**/*.csproj'
      - 'src/**/*.cs'
      - 'src/**/*.targets'
      - 'src/Refitter.MSBuild/README.md'
      - 'docs/docfx_project/articles/msbuild.md'
      - 'test/MSBuild/**'

permissions:
  contents: read

jobs:
  build:
    name: 👌 Verify build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]        
    runs-on: ${{ matrix.os }}
    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
    - name: 🛠️ Build
      working-directory: test/MSBuild
      shell: pwsh
      run: ./build.ps1
    - name: 🗳️ Upload
      uses: actions/upload-artifact@v7
      with:
        name: Packages-${{ matrix.os }}
        path: |
          **/*.nupkg
          README.md
