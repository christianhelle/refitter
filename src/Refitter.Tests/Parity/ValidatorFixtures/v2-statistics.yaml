swagger: '2.0'
info:
  title: Statistics
  version: 1.0.0
consumes: [application/json, application/xml]
produces: [application/json, application/xml]
paths:
  /pets:
    parameters:
      - $ref: '#/parameters/Limit'
    get:
      parameters:
        - name: offset
          in: query
          type: integer
      responses:
        '200':
          description: OK
          headers:
            X-Rate:
              type: integer
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
        default:
          $ref: '#/responses/Error'
    post:
      parameters:
        - name: pet
          in: body
          schema:
            $ref: '#/definitions/Pet'
      responses:
        '201':
          description: Created
  /pets/{id}/photo:
    post:
      consumes: [multipart/form-data]
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: file
          in: formData
          type: file
        - name: caption
          in: formData
          type: string
      responses:
        '204':
          description: No content
definitions:
  Pet:
    type: object
    properties:
      name:
        type: string
parameters:
  Limit:
    name: limit
    in: query
    type: integer
  Body:
    name: body
    in: body
    schema:
      type: object
responses:
  Error:
    description: Error
    schema:
      type: object
