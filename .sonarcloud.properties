# SonarQube Cloud Automatic Analysis configuration.
# Automatic Analysis reads only this file; sonar-project.properties is ignored.
#
# The two test projects must be declared explicitly. SonarCloud's automatic test
# detection had been classifying them as test code (qualifier UTS) off the back of
# the FluentAssertions reference, and reclassified them as production code (FIL)
# when that dependency was replaced with AwesomeAssertions, which its heuristics
# do not recognize. That surfaced ~450 pre-existing test-code smells as new-code
# issues and failed the quality gate. Declaring the test sources keeps the
# classification correct regardless of which assertion library is referenced.
sonar.sources=.
sonar.exclusions=src/Refitter.Tests/**,src/Refitter.SourceGenerator.Tests/**
sonar.tests=.
sonar.test.inclusions=src/Refitter.Tests/**,src/Refitter.SourceGenerator.Tests/**
